<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تابلوی نواحی</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('zb_theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}</script>
<style>
:root[data-theme=dark]{--bg:#0a0e1c;--card:#131a33;--card2:#1a2344;--bd:#243055;--tx:#eaeefb;--mu:#8b97bd;--ac:#7c8cff;--ac2:#b07cff;--buy:#2fe3b0;--sell:#ff6f8a;--A:#2fe3b0;--B:#5aa9ff;--R:#ff8a6b;--g1:rgba(124,140,255,.16);--g2:rgba(176,124,255,.10);--sh:0 10px 30px -12px rgba(0,0,0,.6)}
:root[data-theme=light]{--bg:#f0f3fa;--card:#fff;--card2:#f4f6fc;--bd:#dde3f2;--tx:#12172b;--mu:#667094;--ac:#4a5cf0;--ac2:#8b5cf6;--buy:#0d9f7a;--sell:#e0425f;--A:#0d9f7a;--B:#2f7be8;--R:#e8663f;--g1:rgba(74,92,240,.10);--g2:rgba(139,92,246,.08);--sh:0 10px 30px -14px rgba(30,40,90,.25)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.75 Vazirmatn,Tahoma,sans-serif;background:radial-gradient(900px 420px at 85% -10%,var(--g1),transparent),radial-gradient(700px 380px at 5% 0,var(--g2),transparent),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--bd)}
.bar>div{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font-size:17px;font-weight:800;letter-spacing:-.2px;display:block;line-height:1.2}
.logo small{color:var(--mu);font-size:11px}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 6px 4px 12px}
.me select{background:none;border:0;color:var(--tx);font:inherit;font-weight:600;max-width:120px;cursor:pointer}
.me select:focus{outline:none}
.ico{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:15px}
.av{--h:200;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:hsl(var(--h) 62% 46%);color:#fff;font-weight:800;font-size:12px;flex:none}
.shell{max-width:860px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;position:relative;overflow:hidden}
.st::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--c,var(--ac))}
.st b{font-size:22px;font-weight:800;display:block;line-height:1.3;font-variant-numeric:tabular-nums}
.st span{color:var(--mu);font-size:11.5px}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;gap:2px;margin-bottom:16px}
.tabs button{border:0;background:none;color:var(--mu);font:inherit;font-weight:700;padding:7px 16px;border-radius:9px;cursor:pointer;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 16px -6px var(--ac)}
.tabs i{font-style:normal;background:#ffffff26;border-radius:8px;padding:0 6px;margin-inline-start:6px;font-size:11px}
.list{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px 16px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.anim .card{animation:up .4s both}
.card::before{content:"";position:absolute;inset:0 0 0 auto;width:4px;background:var(--buy)}
.card.sell::before{background:var(--sell)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sym{font-size:21px;font-weight:800;letter-spacing:.3px}
.pill{font-size:11.5px;font-weight:800;padding:2px 11px;border-radius:999px;color:#06101a;background:var(--buy)}
.sell .pill{background:var(--sell)}
.price{margin-inline-start:auto;font:700 21px ui-monospace,Menlo,Consolas,monospace;direction:ltr;font-variant-numeric:tabular-nums}
.by{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12.5px;margin:6px 0 2px}
.by b{color:var(--tx)}
.note{border-inline-start:3px solid var(--bd);padding:2px 12px;margin:10px 0;color:var(--mu);font-size:13px}
.lnk{display:inline-flex;gap:6px;align-items:center;color:var(--ac);font-weight:700;font-size:13px;text-decoration:none;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:4px 12px}
.lad{margin:26px 4px 6px;position:relative}
.rail{height:14px;border-radius:8px;direction:ltr;position:relative;overflow:hidden;background:linear-gradient(90deg,color-mix(in srgb,var(--R) 22%,transparent) var(--p1),color-mix(in srgb,var(--B) 22%,transparent) var(--p1) var(--p2),color-mix(in srgb,var(--A) 22%,transparent) var(--p2))}
.fill{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fill.A{background:var(--A)}.fill.B{background:var(--B)}.fill.R{background:var(--R)}.fill.N,.fill.P{background:var(--mu)}
.tk{position:absolute;top:-17px;font-size:10.5px;color:var(--mu);transform:translateX(-50%);direction:ltr}
.tk::after{content:"";display:block;width:1px;height:20px;background:var(--bd);margin:2px auto 0}
.sc{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.big small{font-size:13px;color:var(--mu);font-weight:500}
.badge{font-weight:800;font-size:12.5px;border-radius:9px;padding:2px 12px;color:#06101a}
.badge.A{background:var(--A)}.badge.B{background:var(--B)}.badge.R{background:var(--R)}.badge.N,.badge.P{background:var(--card2);color:var(--mu);border:1px solid var(--bd)}
.cnt{color:var(--mu);font-size:12.5px}
.votes{margin-top:10px;display:grid;gap:6px}
.vt{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:6px 10px;font-size:13px}
.vt b{font-weight:700}.vt em{font-style:normal;color:var(--mu);flex:1}
.pips{display:flex;gap:3px;direction:ltr}.pips i{width:7px;height:7px;border-radius:50%;background:var(--bd)}.pips i.on{background:var(--ac)}
.rate{display:flex;gap:8px;margin:14px 0 8px;flex-wrap:wrap}
.rate button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card2);color:var(--tx);font:800 15px inherit;cursor:pointer;transition:.15s}
.rate button:hover{border-color:var(--ac);transform:translateY(-2px)}
.rate button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px var(--ac)}
.vrow{display:flex;gap:8px;flex-wrap:wrap}
input,textarea,select{font:inherit}
.in{flex:1;min-width:160px;background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:9px 12px;color:var(--tx)}
.in:focus,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.go{border:0;border-radius:11px;padding:9px 20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:800 14px inherit;cursor:pointer;box-shadow:0 8px 18px -8px var(--ac)}
.go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.ghost{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:10px;padding:5px 13px;font:600 12.5px inherit;cursor:pointer}
.ghost:hover{color:var(--sell);border-color:var(--sell)}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.lock{color:var(--mu);font-size:12.5px}
.why{background:color-mix(in srgb,var(--sell) 12%,transparent);color:var(--sell);border-radius:10px;padding:6px 12px;margin-top:10px;font-size:13px}
.fbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px;background:var(--card2);border-radius:12px}
form.new{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;display:grid;gap:14px;box-shadow:var(--sh)}
form.new h2{margin:0;font-size:17px}
form.new label{display:grid;gap:5px;font-weight:700;font-size:12.5px;color:var(--mu)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card2);color:var(--tx);font:800 15px inherit;cursor:pointer}
.seg .b.on{background:var(--buy);border-color:var(--buy);color:#06101a}.seg .s.on{background:var(--sell);border-color:var(--sell);color:#06101a}
.empty{text-align:center;color:var(--mu);padding:56px 16px;border:1.5px dashed var(--bd);border-radius:18px}
.empty b{display:block;font-size:30px;margin-bottom:6px}
.flt{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.flt button{border:1px solid var(--bd);background:var(--card);color:var(--mu);font:600 12.5px inherit;border-radius:999px;padding:4px 14px;cursor:pointer}
.flt button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{scroll-margin-top:84px}
.card.hl{box-shadow:0 0 0 2px var(--ac),0 0 44px -8px var(--ac);animation:up .4s both,pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--ac2),0 0 60px -4px var(--ac2)}}
.tag{display:inline-block;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 12px;margin-bottom:8px}
.hint{background:var(--card2);border:1px dashed var(--ac);color:var(--tx);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.sk{height:150px;border-radius:18px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;inset:auto 0 20px;margin:auto;width:max-content;max-width:90vw;background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:12px;font-weight:600;z-index:20;animation:up .3s;box-shadow:var(--sh)}
.dsc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.dh{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}.dh h3{margin:0;font-size:15px;font-weight:800}.dh small{color:var(--mu);font-size:11.5px}
.dp{margin-inline-start:auto;display:inline-flex;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:2px}
.dp button{border:0;background:none;color:var(--mu);font:700 12px inherit;padding:3px 11px;border-radius:8px;cursor:pointer}.dp button.on{background:var(--ac);color:#fff}
.drow{--c:var(--mu);display:grid;grid-template-columns:26px 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}
.drow.g{--c:var(--A)}.drow.m{--c:#f0b429}.drow.b{--c:var(--sell)}
.dm b{font-weight:700}.dtag{font-size:11px;font-weight:800;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 8px;margin-inline-start:8px}
.dd{color:var(--mu);font-size:12px}.dn{font:800 17px ui-monospace,Menlo,monospace;color:var(--c);direction:ltr}
.dbar{grid-column:1/-1;height:5px;border-radius:5px;background:var(--card2);overflow:hidden}.dbar i{display:block;height:100%;background:var(--c);border-radius:5px}
.dch{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card2);color:var(--sell);border-radius:999px;padding:1px 10px;font:700 11.5px inherit;cursor:pointer}
.gh{margin:20px 2px 10px;font-weight:800;font-size:14px}.gh i{font-style:normal;background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:0 8px;margin-inline-start:8px;font-size:11.5px;color:var(--mu)}
.gh:first-child{margin-top:4px}.tl{color:var(--mu);font-size:12px;margin:2px 0}.tl.x{color:var(--sell)}
.du{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.du button{padding:9px 4px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card2);color:var(--tx);font:700 13px inherit;cursor:pointer}.du button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
.vt{flex-wrap:wrap;row-gap:2px}
.vtm{margin-inline-start:auto;color:var(--mu);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vt em{flex:1 1 100%;font-size:12.5px;padding-inline-start:36px}
/* رأی خود کاربر و ناحیه‌های ثبت‌شده توسط خودش همیشه واضح و قابل تشخیص‌اند */
.card.voted{border-color:color-mix(in srgb,var(--A) 55%,var(--bd));}
.card.voted .mv{font-size:12px;font-weight:800;color:var(--A);border:1px solid color-mix(in srgb,var(--A) 55%,var(--bd));border-radius:999px;padding:3px 11px;background:color-mix(in srgb,var(--A) 13%,var(--card));}
.card.mine{border:1.5px solid color-mix(in srgb,var(--ac2) 70%,var(--bd));background:linear-gradient(145deg,color-mix(in srgb,var(--ac2) 7%,var(--card)),var(--card) 42%);}
.card.mine::before{width:5px;background:linear-gradient(180deg,var(--ac2),var(--ac));}
.card.mine .card-head{background:linear-gradient(120deg,color-mix(in srgb,var(--ac2) 15%,var(--card2)),var(--card));}
.owner-mark{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--ac2) 17%,var(--card));color:var(--ac2);border:1px solid color-mix(in srgb,var(--ac2) 48%,var(--bd));border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;}
.owner-notice{display:flex;align-items:center;gap:9px;margin:12px 16px 8px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--ac2) 48%,var(--bd));background:color-mix(in srgb,var(--ac2) 10%,var(--card));border-radius:12px;color:var(--tx);font-size:12.5px;font-weight:700;}
.owner-notice small{display:block;color:var(--mu);font-weight:500;font-size:11.5px;}
.vt.my-vote{border:1px solid color-mix(in srgb,var(--A) 62%,var(--bd));background:color-mix(in srgb,var(--A) 12%,var(--card2));}
.vt.my-vote .my-vote-tag{font-size:10.5px;font-weight:800;color:var(--A);background:color-mix(in srgb,var(--A) 13%,var(--card));border:1px solid color-mix(in srgb,var(--A) 40%,var(--bd));border-radius:7px;padding:1px 7px;}
.mv{font-size:12px;font-weight:800;color:var(--A);border:1px solid color-mix(in srgb,var(--A) 55%,var(--bd));border-radius:999px;padding:3px 11px;background:color-mix(in srgb,var(--A) 13%,var(--card2));}
.dnote{color:var(--mu);font-size:11.5px;margin:8px 0 2px}.dbar.tri{display:flex;gap:2px;background:var(--card2)}.dbar.tri i{height:100%;border-radius:0;flex:none}.dbar.tri i.o,.dleg i.o{background:var(--A)}.dbar.tri i.p,.dleg i.p{background:var(--ac)}.dbar.tri i.x,.dleg i.x{background:var(--sell)}
.dleg{display:flex;gap:12px;flex-wrap:wrap;color:var(--mu);font-size:11px;margin:2px 0 6px}.dleg span{display:inline-flex;align-items:center;gap:4px}.dleg i{display:inline-block;width:9px;height:9px;border-radius:3px}
.dhl{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;margin:8px 0 4px}
.dhelp{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;margin:8px 0;font-size:12px;line-height:1.9}.dhelp ul{margin:4px 0 0;padding-inline-start:18px}
.dsp{color:var(--ac);font-weight:700;white-space:nowrap}
.dx{display:none;border:1px solid var(--bd);background:var(--card2);color:var(--sell);border-radius:999px;padding:0 10px;font:700 11.5px inherit;cursor:pointer;margin-inline-start:6px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.price,.sym{font-size:18px}.logo small{display:none}
 .dsc{padding:10px 12px;margin-bottom:12px;border-radius:16px}
 .dh h3{font-size:14px}.dh small{flex:1}
 .dp{margin-inline-start:0;order:5;flex:1 1 100%;display:grid;grid-template-columns:repeat(3,1fr)}
 .dsc.shut .dp{display:none}
 .drow{padding:7px 0;gap:2px 8px;grid-template-columns:26px 1fr auto}
 .dd{font-size:11.5px;line-height:1.9}.dn{font-size:15px}
 .dx{display:inline-flex}
 .dch{display:none;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
 .drow.open .dch{display:flex}
 .chip{flex:none}
 .vtm{font-size:11px}}

/* بازطراحی کارت‌ها؛ فقط لایه‌ی نمایشی، بدون تغییر رفتار فرم‌ها و رأی‌گیری */
.card{padding:0;border-radius:20px;overflow:hidden}
.card-head{padding:16px 18px 12px;background:linear-gradient(135deg,color-mix(in srgb,var(--card2) 72%,transparent),var(--card));border-bottom:1px solid var(--bd)}
.card-head .hd{gap:9px}
.card-head .sym{font-size:22px;letter-spacing:.2px}
.card-head .price{font-size:20px;background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:3px 10px}
.card-head .by{margin:10px 0 3px;gap:7px;flex-wrap:wrap}
.meta-dot{color:var(--bd)}
.card-head .tl{margin-top:7px}
.card-head .note{margin:10px 0 7px}
.score-panel{margin:13px 16px 10px;padding:12px 14px 10px;border:1px solid var(--bd);border-radius:15px;background:var(--card2)}
.score-title,.votes-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.score-title>b,.votes-heading>b{font-weight:800}
.status-mini{font-size:11px;color:var(--mu);font-weight:700}
.status-mini.A{color:var(--A)}.status-mini.B{color:var(--B)}.status-mini.R{color:var(--R)}
.score-panel .lad{margin:28px 0 4px}
.score-panel .sc{margin-top:12px}
.score-caption{margin-inline-start:6px}
.votes-wrap{margin:12px 16px 8px}
.votes-heading{color:var(--mu);margin-bottom:8px}
.votes{margin-top:0}
.vtg{padding:2px 11px;font-size:11.5px;color:var(--ac);border-color:var(--ac)}.vtg:hover{color:var(--ac2);border-color:var(--ac2)}.votes-heading{flex-wrap:wrap}
.votes-empty{margin:12px 16px;padding:10px 12px;border:1px dashed var(--bd);border-radius:12px;color:var(--mu);font-size:12px;text-align:center}
.vote-box{margin:12px 16px;padding:12px;background:var(--card2);border:1px solid var(--bd);border-radius:15px}
.vote-prompt{font-weight:800;font-size:12px;color:var(--mu)}
.vote-box .rate{margin:9px 0}
.vote-box.done{background:color-mix(in srgb,var(--mu) 16%,var(--card));border:1px dashed var(--mu)}
.vote-box.done .vote-prompt{color:var(--mu)}
.vote-box.done .rate button{background:color-mix(in srgb,var(--mu) 14%,var(--card));border-color:transparent;color:var(--mu);opacity:.5;filter:grayscale(1);transform:none}
.vote-box.done .rate button.on{background:var(--A);border-color:var(--A);color:#06101a;opacity:1;filter:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--A) 30%,transparent)}
.vote-box.done .vrow{opacity:.8}
.card.voted{background:color-mix(in srgb,var(--mu) 12%,var(--card));border:1px dashed var(--mu)}
.card.voted::before{background:var(--mu)}
.card.voted .card-head,.card.voted .score-panel,.card.voted .votes-heading,.card.voted .vt:not(.my-vote),.card.voted .ft{filter:grayscale(1);opacity:.5}
.card.voted .card-head{background:none}
.card.voted .vt.my-vote{box-shadow:0 0 0 2px color-mix(in srgb,var(--A) 35%,transparent)}
.card.fold .by,.card.fold .tl,.card.fold .score-panel,.card.fold .votes-heading,.card.fold .vt:not(.my-vote),.card.fold .vote-box,.card.fold .ft{display:none}
.card.fold .card-head{border-bottom:0;padding-bottom:8px}
.card.fold .card-head .note{margin:8px 0 2px}
.card.fold .votes-wrap{margin:2px 16px 4px}
.card.voted .card-head{opacity:.75}

let D={members:[],zones:[]},me='',tab='active',flt='all',sel={},fz=null,dir='buy',focusId=new URLSearchParams(location.search).get('z')||'',hlOn=true,jumped=false,dp='d',dOpen=!matchMedia('(max-width:560px)').matches,du=60,inst=false,dxo=new Set(),vx=new Set(),cx=new Set(),awOpen=false,awEd={},awSt={},dHelp=false,vo=z=>me&&z.votes[me]?1:0;

 if(s.options.length!=D.members.length+1)s.innerHTML='<option value="">انتخاب نام…</option>'+D.members.map(m=>`<option>${esc(m)}</option>`).join('');

 const m=Math.max(1,Math.ceil((z.t+d*6e4-Date.now())/6e4)),h=Math.floor(m/60);return`<div class="tl">⏱ مهلت ${d>=60?fa(d/60)+' ساعت':fa(d)+' دقیقه'} · ${h?fa(h)+' ساعت و ':''}${fa(m%60)} دقیقه مانده</div>`}

 vr=([k,v])=>`<div class="vt ${k===me?'my-vote':''}">${av(k)}<b>${esc(k)}</b>${k===me?'<span class="my-vote-tag">رأی شما</span>':''}<span class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=v.s?'on':''}"></i>`).join('')}</span><span>${fa(v.s)}/۵</span>${vtm(z,v)}${v.c?`<em>${esc(v.c)}</em>`:''}</div>`;
 const status= z.false?'False شده':(st.closed?'رأی‌گیری بسته شده':st.expired?'مهلت تمام شده':'در انتظار رأی');
 return`<article class="card ${z.dir}${isMine?' mine':''}${z.id===focusId&&hlOn?' hl':''}${vd?' voted':''}${vd&&!cx.has(z.id)?' fold':''}" id="z${z.id}">${z.id===focusId&&hlOn?'<div class="tag">🎯 ناحیه‌ای که از لینک باز کردید</div>':''}
 <div class="card-head"><div class="hd"><span class="sym">${esc(z.sym)}</span>${z.no?`<span class="zno">#Z${z.no}</span>`:''}<span class="pill">${z.dir=='buy'?'▲ بای':'▼ سل'}</span>${isMine?'<span class="owner-mark">✦ ناحیه ثبت‌شده توسط شما</span>':''}${vd?`<span class="mv">✓ رأی شما: ${fa(mine.s)} از ۵</span>`:''}<span class="price">${esc(z.price)}</span></div>

</article>`}
function disc(){const now=Date.now(),from=dp=='d'?Math.floor((now+12600000)/864e5)*864e5-12600000:now-(dp=='w'?7:30)*864e5,zs=D.zones.filter(z=>z.t>=from&&z.dur&&!off(z.t));
